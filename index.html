<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#14263c">
  <meta name="description" content="A shared online home for the Moretto Álvarez family and their individual pages.">
  <title>Moretto Álvarez</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314263c'/%3E%3Ctext x='32' y='43' fill='%23d9b76f' font-family='Arial,sans-serif' font-size='26' font-weight='700' text-anchor='middle'%3EM%C3%81%3C/text%3E%3C/svg%3E">
  <style>
    :root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f5ef;color:#14263c;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0}
    a{color:inherit}
    .page{min-height:100svh;display:grid;grid-template-columns:minmax(0,1.07fr) minmax(0,.93fr)}
    .welcome{background:#14263c;color:#f7f5ef;display:flex;flex-direction:column;min-width:0;padding:34px clamp(32px,5vw,88px) 48px}
    .monogram{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border:1px solid #b79a63;border-radius:50%;color:#e3c47f;font-family:Georgia,"Times New Roman",serif;font-size:1.04rem;letter-spacing:-.06em}
    .welcome-content{margin:auto 0;padding:86px 0 76px}
    .eyebrow{margin:0 0 29px;color:#d9b76f;font-size:.85rem;font-weight:750;letter-spacing:.19em;text-transform:uppercase}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(4.4rem,7.3vw,8.6rem);font-weight:400;line-height:1.06;letter-spacing:-.055em}
    h1 span{display:block}
    h1 span+span{margin-top:.035em;color:#e4c581}
    .intro{max-width:490px;margin:46px 0 0;padding-top:29px;border-top:1px solid rgba(217,183,111,.62);color:#e1e5e5;font-size:clamp(1.06rem,1.45vw,1.25rem);line-height:1.7}
    .directory-panel{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:72px clamp(32px,5vw,92px);background:#f7f5ef}
    .directory-top{display:flex;align-items:center;gap:16px;margin-bottom:48px}
    .directory-top::before{content:"";width:28px;height:1px;background:#ad8c4d}
    .directory-top span{font-size:.84rem;font-weight:750;letter-spacing:.18em;text-transform:uppercase;color:#726245}
    .directory-title{margin:0 0 16px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.15rem,3.2vw,3.25rem);font-weight:400;letter-spacing:-.035em}
    .directory{margin-top:37px;border-top:1px solid #bfc6c6}
    .person{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:122px;padding:17px 2px;border-bottom:1px solid #bfc6c6;text-decoration:none}
    .number{color:#765b2d;font-size:.85rem;font-weight:750}
    .name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.7rem,2.5vw,2.4rem);letter-spacing:-.035em;line-height:1.15}
    .status{color:#718091;font-size:.84rem;white-space:nowrap}
    .person.live .name,.person.live .status{color:#14263c}
    .person.live .status{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid #ad8c4d;border-radius:50%;font-size:1.3rem;transition:background .2s ease,color .2s ease}
    .person.live:hover .status,.person.live:focus-visible .status{background:#14263c;color:#e4c581}
    .person.live:focus-visible{outline:2px solid #14263c;outline-offset:4px}
    .person.soon .name{color:#73808a}
    @media(max-width:850px){.page{grid-template-columns:1fr}.welcome{min-height:590px}.welcome-content{padding:70px 0 58px}.directory-panel{padding-block:72px 96px}.person{min-height:104px}}
    @media(max-width:480px){.welcome{min-height:unset;padding:25px 26px 32px}.welcome-content{padding:77px 0 67px}.eyebrow{margin-bottom:20px}h1{font-size:clamp(3.45rem,13vw,5.5rem);line-height:1.1}.intro{margin-top:34px;padding-top:25px;font-size:1.06rem}.directory-panel{padding:58px 26px 74px}.directory-top{margin-bottom:34px}.directory{margin-top:28px}.person{grid-template-columns:29px minmax(0,1fr) auto;gap:7px}.name{font-size:1.78rem}.status{font-size:.72rem}.person.live .status{width:36px;height:36px}}
    @media(prefers-reduced-motion:reduce){.person.live .status{transition:none}}
  </style>
</head>
<body>
  <main class="page">
    <section class="welcome" aria-labelledby="family-name">
      <div class="monogram" aria-hidden="true">MÁ</div>
      <div class="welcome-content">
        <p class="eyebrow">A family home online</p>
        <h1 id="family-name"><span>Moretto</span><span>Álvarez.</span></h1>
        <p class="intro">One shared address for our family. A place to connect our individual sites, projects, and stories as they grow.</p>
      </div>
    </section>
    <section class="directory-panel" aria-labelledby="directory-title">
      <div class="directory-top"><span>Directory</span></div>
      <h2 class="directory-title" id="directory-title">Family pages.</h2>
      <nav class="directory" aria-label="Family pages">
        <a class="person live" href="https://vince.morettoalvarez.com/" aria-label="Visit Vince’s site"><span class="number">01</span><span class="name">Vince</span><span class="status" aria-hidden="true">↗</span></a>
        <div class="person soon"><span class="number">02</span><span class="name">Ilvander</span><span class="status">Coming soon</span></div>
        <div class="person soon"><span class="number">03</span><span class="name">Khai</span><span class="status">Coming soon</span></div>
      </nav>
    </section>
  </main>
</body>
</html>
